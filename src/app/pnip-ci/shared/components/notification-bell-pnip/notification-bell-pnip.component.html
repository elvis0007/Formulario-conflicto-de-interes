<button
    #boton
    type="button"
    class="campana"
    [attr.aria-label]="etiquetaBoton"
    [attr.aria-expanded]="abierto"
    aria-controls="pnip-panel-notificaciones"
    (click)="alternar()">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20a2 2 0 0 0 4 0"
            fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @if (noLeidas > 0) {
        <span class="contador" aria-hidden="true">{{ noLeidas }}</span>
    }
</button>

@if (abierto) {
    <section
        id="pnip-panel-notificaciones"
        class="panel"
        aria-label="Notificaciones">
        <header class="panel-cabecera">
            <h2 class="panel-titulo">Notificaciones</h2>
            <button
                type="button"
                class="marcar"
                [disabled]="noLeidas === 0"
                (click)="marcarTodas()">Marcar todas como leídas</button>
        </header>

        @if (notificaciones.length === 0) {
            <p class="vacio">No hay notificaciones recientes.</p>
        } @else {
            <ul class="lista">
                @for (n of notificaciones; track n.id) {
                    <li class="notificacion" [class.no-leida]="!n.leida">
                        <span
                            class="punto"
                            [style.background-color]="'var(--' + tono(n) + ')'"
                            aria-hidden="true"></span>
                        <div class="notificacion-cuerpo">
                            <p class="notificacion-titulo">
                                {{ n.titulo }}
                                @if (!n.leida) {
                                    <span class="solo-lectores">(sin leer)</span>
                                }
                            </p>
                            <p class="notificacion-texto">{{ n.texto }}</p>
                            <time class="notificacion-tiempo"
                                [attr.datetime]="n.fecha">
                                {{ n.fecha | tiempoRelativo }}
                            </time>
                        </div>
                    </li>
                }
            </ul>
        }

        <footer class="panel-pie">{{ textoPie }}</footer>
    </section>
}
