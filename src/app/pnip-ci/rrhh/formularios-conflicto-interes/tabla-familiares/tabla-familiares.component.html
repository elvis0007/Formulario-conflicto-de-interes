@if (familiares.length === 0) {
    <p class="vacio">No declaró familiares.</p>
} @else {
    <table class="familiares">
        <caption>Familiares declarados ({{ familiares.length }})</caption>
        <thead>
            <tr>
                <th scope="col">Parentesco</th>
                <th scope="col">Nombre</th>
                <th scope="col">Cédula</th>
                <th scope="col">Relación con la empresa</th>
            </tr>
        </thead>
        <tbody>
            @for (familiar of familiares; track familiar.cedula) {
                <tr>
                    <td>{{ familiar.parentesco }}</td>
                    <td>{{ familiar.nombre }}</td>
                    <td>{{ familiar.cedula }}</td>
                    <td>
                        <app-pnip-badge
                            [tono]="familiar.trabajaEnEmpresa ? 'azul' : 'gris'"
                            [texto]="familiar.trabajaEnEmpresa
                                ? 'Trabaja en la empresa'
                                : 'No trabaja en la empresa'" />
                    </td>
                </tr>
            }
        </tbody>
    </table>
}
