<div class="listado">
    <div class="banda banda--con-accion">
        <h2 class="banda-titulo">No han llenado formulario ({{ empleados.length }})</h2>
        <button
            type="button"
            class="boton boton--primario"
            [class.boton--hecho]="todosEnviados"
            [attr.aria-disabled]="todosEnviados || empleados.length === 0"
            (click)="enviarATodos()">
            <app-pnip-icono [nombre]="todosEnviados ? 'check' : 'enviar'" />
            {{ todosEnviados ? 'Enviado a todos ✓' : 'Enviar recordatorio a todos' }}
        </button>
    </div>
</div>

<app-pnip-data-table
    variante="navy"
    etiqueta="Personas que no han llenado el formulario"
    [filas]="empleados"
    [columnas]="columnas"
    [claveFila]="clave">
    <ng-template pnipFila [pnipFilaDe]="empleados" let-e>
        <td class="nombre">{{ e.persona.nombres | nombreFormal }}</td>
        <td>{{ e.persona.cedula }}</td>
        <td>
            <app-pnip-badge
                [tono]="e.origen === 'Interno' ? 'verde' : 'naranja'"
                [texto]="e.origen" />
        </td>
        <td>{{ e.persona.cargo }}</td>
        <td>{{ e.persona.departamento }}</td>
        <td>
            @if (e.ultimoRecordatorio) {
                {{ e.ultimoRecordatorio | fechaLarga }}
            } @else {
                <span class="nunca">Nunca</span>
            }
        </td>
        <td>
            <button
                type="button"
                class="boton boton--fila"
                [class.boton--hecho]="enviados.has(e.persona.id)"
                [attr.aria-disabled]="enviados.has(e.persona.id)
                    || enviando.has(e.persona.id)"
                [attr.aria-label]="(enviados.has(e.persona.id)
                    ? 'Recordatorio enviado a '
                    : 'Enviar recordatorio a ') + e.persona.nombres"
                (click)="enviarUno(e)">
                <app-pnip-icono
                    [nombre]="enviados.has(e.persona.id) ? 'check' : 'enviar'"
                    [tamano]="16" />
                @if (enviados.has(e.persona.id)) {
                    Enviado ✓
                } @else if (enviando.has(e.persona.id)) {
                    Enviando…
                } @else {
                    Enviar recordatorio
                }
            </button>
        </td>
    </ng-template>

    <app-pnip-empty-state
        pnipVacio
        [texto]="cargando
            ? 'Cargando…'
            : 'Todas las personas han llenado el formulario.'" />
</app-pnip-data-table>
