<div class="app-container">
  <app-header *ngIf="!esLoginRoute"></app-header>
  <!-- [PNIP-CI] Elvis Flores - 30/09/2026
       Qué hace: en /rrhh/** y /responsable/** agrega a <main> la clase
       app-main--gestion y pinta el menú lateral real junto al contenido,
       igual que en /admin. En el resto de rutas no se pinta. -->
  <main class="app-main" [class.app-main--gestion]="esRutaGestion">
    <app-sidebar-menu
      *ngIf="esRutaGestion"
      [activeSection]="null"
      [canViewList]="puedeVerListaFormularios"
    ></app-sidebar-menu>
    <!-- [FIN PNIP-CI] -->
    <router-outlet />
  </main>
  <app-footer *ngIf="!esLoginRoute"></app-footer>
  <!-- [PNIP-CI DEV] Elvis Flores - 02/10/2026 - ELIMINAR ANTES DE PRODUCCIÓN
       Qué hace: selector de rol de la sesión simulada. Solo se pinta en
       desarrollo y con SISCI-DEV-SESION-SIMULADA = true. -->
  <app-selector-rol-dev></app-selector-rol-dev>
  <!-- [FIN PNIP-CI DEV] -->
</div>
