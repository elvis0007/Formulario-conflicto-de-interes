<header class="app-header">
  <div class="header-logo">
    <img src="/sisci/assets/LogoBlancoEEASA.png" alt="EEASA" class="header-logo-img" />
  </div>
  <h1>EMPRESA ELÉCTRICA AMBATO REGIONAL CENTRO NORTE S.A.</h1>
  
  
  <div class="header-actions">
    <!-- [PNIP-CI] Elvis Flores - 01/10/2026
         Qué hace: muestra quién está logueado y su rol en texto. -->
    <div class="header-usuario" *ngIf="haySesion()">
      <span class="header-usuario-nombre" [title]="nombreUsuarioSesion()">{{ nombreUsuarioSesion() }}</span>
      <span class="header-usuario-rol">{{ etiquetaRolSesion() }}</span>
    </div>
    <!-- [FIN PNIP-CI] -->

    <!-- [PNIP-CI] Elvis Flores - 01/10/2026
         Qué hace: el ícono aparece también en /rrhh/** y /responsable/**.
         Solo cambia su *ngIf (antes: isAdminRoute). Fuera de /admin se
         exige A o R, que son los únicos que llegan a /admin, así que su
         regla de rol no cambia. Al hacer clic hace lo mismo que siempre. -->
    <button
      *ngIf="isAdminRoute || (esRutaGestion && isAdminOrRrhh)"
      class="header-icon-btn"
      (click)="openGenerateCodeModal()"
      title="Generar código de acceso"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11a4 4 0 1 1 8 0v2"></path>
        <rect x="7" y="13" width="10" height="8" rx="2" ry="2"></rect>
        <line x1="10" y1="17" x2="14" y2="17"></line>
      </svg>
    </button>
    <!-- [FIN PNIP-CI] -->

    <!-- [PNIP-CI] Elvis Flores - 01/10/2026
         Qué hace: el ícono aparece también en /rrhh/** y /responsable/**.
         Solo cambia su *ngIf (antes: isAdminRoute && canManageRRHH); sigue
         siendo solo para A. Al hacer clic hace lo mismo que siempre. -->
    <button
      *ngIf="(isAdminRoute || esRutaGestion) && canManageRRHH"
      class="header-icon-btn"
      (click)="openManageRrhhModal()"
      title="Gestionar Jefes de RRHH"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M4 19c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5"></path>
        
      </svg>
    </button>
    <!-- [FIN PNIP-CI] -->

    <!-- [PNIP-CI] Elvis Flores - 01/10/2026
         Qué hace: acceso del Responsable (rol P) a su dashboard. Lo
         necesita porque entra por defecto al formulario, que no tiene menú
         lateral. -->
    <button
      *ngIf="esResponsable"
      class="header-icon-btn"
      (click)="irAMisActividades()"
      title="Mis actividades de conflicto de interés"
      aria-label="Mis actividades de conflicto de interés"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="9" y="2" width="6" height="4" rx="1" ry="1"></rect>
        <polyline points="9 14 11 16 15 12"></polyline>
      </svg>
    </button>
    <!-- [FIN PNIP-CI] -->

    <button
      class="header-icon-btn"
      (click)="verMisFormularios()"
      title="Mis declaraciones"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v4l3 3"></path>
        <path d="M3.05 11a9 9 0 1 1 .5 4"></path>
        <polyline points="3 21 3 16 8 16"></polyline>
      </svg>
    </button>

    <button class="header-icon-btn" (click)="toggleDarkMode()">
      <svg *ngIf="!darkMode" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg *ngIf="darkMode" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <button class="header-icon-btn header-logout-btn" (click)="logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </button>

  </div>
</header>
